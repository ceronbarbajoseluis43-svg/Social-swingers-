name: Compilar Social Swingers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Conceder permisos de ejecución a gradlew
        run: chmod +x ./gradlew
        working-directory: App

      - name: Compilar APK
        run: ./gradlew assembleRelease --stacktrace
        working-directory: App

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Social-Swingers-APK
          path: "**/build/outputs/apk/release/*.apk"
          
