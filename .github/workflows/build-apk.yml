name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # Puedes cambiarlo por 'temurin' si lo prefieres
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Al usar la v4, ya no buscará el paquete antiguo 'tools'
          cmdline-tools-version: 'latest' 

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK de producción
        run: ./gradlew assembleRelease

      - name: Guardar el archivo APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
