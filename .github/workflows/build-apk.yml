name: APK para crear usuarios de redes sociales

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Compilador APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Social-Swingers-APK
          path: '**/build/outputs/apk/release/*.apk'
          
