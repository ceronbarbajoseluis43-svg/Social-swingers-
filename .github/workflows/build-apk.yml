name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Configurar la versión correcta de Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. CORRECCIÓN: Aceptar licencias usando el SDK manager preinstalado en la máquina virtual
      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 4. Dar permisos de ejecución al script compilador de Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./app

      # 5. Compilar la aplicación
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./app

      # 6. Guardar el archivo APK resultante
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
