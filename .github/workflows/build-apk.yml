name: Compilar Social Swingers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # Reemplaza la instalación manual. Este comando asegura que las herramientas estén listas.
      - name: Instalar SDK Android
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Dar permisos de ejecución al wrapper de Gradle de tu proyecto
      - name: Dar permisos a Gradlew
        run: chmod +x ./gradlew

      # Compilar usando el wrapper local en lugar del comando global 'gradle'
      - name: Compilar APK
        run: ./gradlew assembleRelease --stacktrace

       Tarjeta de almacenamiento del APK resultante
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Social-Swingers-APK
          path: "**/build/outputs/apk/release/*.apk"

