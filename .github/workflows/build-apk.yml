name: Build Social Swingers APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Definimos la variable de entorno a nivel de entorno o de job para Node
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    # Forzar una versión estable de Java requerida para compilar Android
    - - name: Setup Android SDK
uses: android-actions/setup-android@v4
  with:
        distribution: 'zulu'
        java-version: '17'

    # Usar la versión recomendada y actualizada para configurar el SDK
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34          # Cambia al nivel de API que requiera tu app
        build-tools: 34.0.0    # Cambia a la versión de herramientas que uses
