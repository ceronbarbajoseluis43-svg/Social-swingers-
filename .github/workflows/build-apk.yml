name: Build Android APK

on:
  push:
    branches:
      - main  # Cambia esto por tu rama si usas 'master' u otra

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Configurar la versión correcta de Java (JDK 17 es la recomendada para proyectos modernos)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar el SDK de Android de forma limpia y moderna
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. PASO CLAVE: Aceptar automáticamente todas las licencias del SDK para que no falle
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 5. Dar permisos de ejecución al script compilador de Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 6. Compilar la aplicación en limpio para generar el archivo APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Guardar el archivo APK resultante en los artefactos de GitHub para poder descargarlo
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
